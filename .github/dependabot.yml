version: 2
updates:
  # Keeps the SHA-pinned GitHub Actions up to date. Review each bump.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      cargo-minor-and-patch:
        update-types: ["minor", "patch"]
