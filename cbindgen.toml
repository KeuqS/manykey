language = "C"
include_guard = "MANYKEY_H"
header = "/* manykey C API. Generated by cbindgen from src/capi.rs: do not edit by hand. */"
cpp_compat = true
usize_is_size_t = true
documentation_style = "c"
style = "type"

[parse]
parse_deps = false

[export]
include = []
exclude = ["Key", "DEFAULT_CAPACITY"]

[enum]
rename_variants = "None"
