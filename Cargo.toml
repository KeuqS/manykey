[package]
name = "manykey"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Receive keyboard input tagged with the physical keyboard it came from"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "manykey"
path = "src/bin/manykey.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[workspace]
members = [".", "apps/keyboard-view"]
default-members = ["."]
